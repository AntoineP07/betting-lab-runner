name: judge

# Verdict hebdomadaire. Règle les paris enregistrés par paper.yml et applique les critères de CHARTER.md.
on:
  schedule:
    - cron: "50 5 * * 1"      # lundi matin (UTC)
  workflow_dispatch:

concurrency:
  group: lab-judge
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AntoinePinto/betting-lab
          token: ${{ secrets.LAB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_JUDGE_SA_KEY }}
      - name: Verdict
        run: python -m judge.evaluate
      - name: Enregistrement
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/AntoinePinto/betting-lab.git"
          bash scripts/push.sh "judge : verdict du $(date -u +%F)"
      - name: Alerte si un candidat réussit
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN }}
        run: |
          if jq -e '.any_success' judge/status.json > /dev/null; then
            gh label create needs-human -R AntoinePinto/betting-lab --color D93F0B --force || true
            gh issue create -R AntoinePinto/betting-lab --label needs-human --title "Un candidat satisfait le critère de succès" \
              --body "Voir judge/status.json et judge/verdicts/. Aucun argent réel n'est engagé sans ta décision."
          fi
