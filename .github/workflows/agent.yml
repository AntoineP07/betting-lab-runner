name: agent

# Lance un agent Claude (abonnement, via CLAUDE_CODE_OAUTH_TOKEN) qui clone le dépôt, travaille
# une session, puis pousse ses commits APRÈS contrôle du garde-fou. Voir docs/SETUP.md.
#
# CADENCE : une session par heure (ligne cron ci-dessous, UTC). Le RÔLE de chaque session n'est plus fixé
# par l'horloge : scripts/dispatch.py (dépôt privé) le choisit d'après l'état du dépôt (idée à contre-expertiser,
# file à classer, contrôle de santé en échec, sinon exploration). Pour tout arrêter : fichier STOP à la racine.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      role:
        description: "vide = choisi par dispatch.py ; sinon explorer | skeptic | librarian | engineer"
        default: ""
      focus:
        description: "consigne libre pour cette session (facultatif)"
        default: ""

concurrency:
  group: lab-agent
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AntoinePinto/betting-lab
          token: ${{ secrets.LAB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rôle et arrêt
        id: ctx
        env:
          INPUT_ROLE: ${{ inputs.role }}
        run: |
          # dispatch.py n'utilise que la bibliothèque standard : rien à installer avant.
          ROLE=$(python3 scripts/dispatch.py | sed -n 's/^role=//p')
          if [ -f STOP ] || [ "$ROLE" = "none" ]; then
            echo "stop=1" >> "$GITHUB_OUTPUT"; echo "STOP présent : session ignorée"
          fi
          case "$INPUT_ROLE" in explorer|skeptic|librarian|engineer) ROLE="$INPUT_ROLE" ;; esac
          echo "rôle : ${ROLE:-explorer}"
          echo "role=${ROLE:-explorer}" >> "$GITHUB_OUTPUT"
          echo "now=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - name: Réponses de l'humain (issues -> inbox/)
        if: steps.ctx.outputs.stop != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN }}
        run: python3 scripts/human_loop.py pull

      - uses: actions/setup-python@v5
        if: steps.ctx.outputs.stop != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        if: steps.ctx.outputs.stop != '1'
        run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        if: steps.ctx.outputs.stop != '1'
        with:
          credentials_json: ${{ secrets.GCP_EXPLORER_SA_KEY }}

      - name: Session de l'agent
        if: steps.ctx.outputs.stop != '1'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: "false"   # dépôt public : jamais de transcription dans les logs
          display_report: "false"
          prompt: |
            Tu es l'agent « ${{ steps.ctx.outputs.role }} » de betting-lab. Le dépôt est déjà cloné dans le
            dossier courant. Lis CLAUDE.md (il importe AGENTS.md et CHARTER.md), puis suis le déroulé
            d'AGENTS.md. Ton rôle est décrit dans .claude/agents/${{ steps.ctx.outputs.role }}.md.
            Date et heure UTC réelles : ${{ steps.ctx.outputs.now }}. C'est la seule source de vérité pour les noms de fichiers,
            les dossiers research/, les notes journal/ et les champs ts du ledger : ne déduis jamais la date des fichiers existants.
            ${{ inputs.focus }}
            Contraintes d'exécution : une seule unité de travail ; commits locaux en français ; AUCUN
            git push (le workflow pousse après contrôle) ; termine par une note de passation dans journal/.
          claude_args: |
            --max-turns 250
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Agent,Bash(python *),Bash(python3 *),Bash(pip install *),Bash(pytest *),Bash(git add *),Bash(git commit *),Bash(git status*),Bash(git log *),Bash(git diff *),Bash(git show *),Bash(git rm *),Bash(cp *),Bash(cd *),Bash(echo *),Bash(grep *),Bash(sed *),Bash(find *),Bash(awk *),Bash(od *),Bash(cut *),Bash(diff *),Bash(mv *),Bash(rm *),Bash(touch *),Bash(pip list*),Bash(pip show*),Bash(ls *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(mkdir *),Bash(sort *),Bash(jq *),Bash(date *)"

      - name: Transcription vers le bucket privé
        if: steps.ctx.outputs.stop != '1' && always()
        continue-on-error: true
        env:
          ROLE: ${{ steps.ctx.outputs.role }}
        run: |
          f="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$f" ]; then
            name="transcriptions/$(date -u +%F)/${GITHUB_RUN_ID}-${ROLE}.json"
            # envoi par l'API : seul le droit de création est nécessaire (pas de lecture)
            curl -sf -X POST --data-binary @"$f" -H "Content-Type: application/json"               -H "Authorization: Bearer $(gcloud auth print-access-token)"               "https://storage.googleapis.com/upload/storage/v1/b/betting-lab-logs-502015/o?uploadType=media&name=${name//\//%2F}" > /dev/null               && echo "transcription envoyée" || { echo "envoi de la transcription échoué"; exit 1; }
          else
            echo "pas de transcription à envoyer"
          fi

      - name: Contrôle et push
        id: push
        if: steps.ctx.outputs.stop != '1' && always()
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN }}
          ROLE: ${{ steps.ctx.outputs.role }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/AntoinePinto/betting-lab.git"
          set +e
          bash scripts/push.sh "agent ${ROLE} : session du $(date -u +%F\ %H:%M)" --guard
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "3" ] && exit 0
          exit "$code"

      - name: Demandes à l'humain (outbox/ -> issues)
        id: loop
        if: steps.push.outputs.code == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN }}
        run: python3 scripts/human_loop.py push

      # Les issues du dépôt privé sont créées avec LAB_TOKEN, donc au nom de son propriétaire : GitHub ne lui
      # envoie pas de courriel. Ce commentaire, sans aucun contenu, part du dépôt runner pour le prévenir.
      - name: Prévenir l'humain (sans contenu)
        if: steps.loop.outputs.created != '' && steps.loop.outputs.created != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.loop.outputs.created }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --json number,title \
              --jq '[.[] | select(.title | startswith("Demandes en attente"))][0].number // empty')
          if [ -z "$n" ]; then
            n=$(gh issue create -R "$GITHUB_REPOSITORY" --title "Demandes en attente dans le dépôt privé" \
              --body "Le laboratoire attend des réponses : voir les issues étiquetées outbox du dépôt privé. Cette issue ne contient aucun contenu de recherche." | sed 's#.*/##')
          fi
          gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$N nouvelle(s) demande(s) dans le dépôt privé."

      - name: Travail écarté par le garde-fou
        if: steps.push.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN }}
        run: |
          gh issue create -R AntoinePinto/betting-lab --title "Garde-fou : session de l'agent écartée ($(date -u +%F))" \
            --body "Le travail de la session a été écarté (chemin protégé, fichier trop gros ou secret détecté). Run ${GITHUB_RUN_ID} du dépôt runner ; le patch est dans le bucket privé (rejected/)." || true
      - name: Patch rejeté vers le bucket privé
        if: steps.push.outputs.code == '3'
        continue-on-error: true
        run: |
          name="rejected/$(date -u +%F)/${GITHUB_RUN_ID}.patch"
          curl -sf -X POST --data-binary @/tmp/rejected.patch -H "Content-Type: text/plain"             -H "Authorization: Bearer $(gcloud auth print-access-token)"             "https://storage.googleapis.com/upload/storage/v1/b/betting-lab-logs-502015/o?uploadType=media&name=${name//\//%2F}" > /dev/null
