name: agent

# Lance un agent Claude (abonnement, via CLAUDE_CODE_OAUTH_TOKEN) qui clone le dépôt, travaille
# une session, puis pousse ses commits APRÈS contrôle du garde-fou. Voir docs/SETUP.md.
#
# CADENCE : modifie les lignes cron ci-dessous (UTC). Pour réduire la consommation,
# supprime des lignes ; pour tout arrêter, crée un fichier STOP à la racine.
on:
  schedule:
    - cron: "17 */3 * * *"   # explorateur, 8 fois par jour
    - cron: "41 3,15 * * *"  # sceptique, 2 fois par jour
    - cron: "23 21 * * *"    # bibliothécaire, tous les jours
    - cron: "53 8 * * *"     # ingénieur, tous les jours
  workflow_dispatch:
    inputs:
      role:
        description: "explorer | skeptic | librarian | engineer"
        default: "explorer"
      focus:
        description: "consigne libre pour cette session (facultatif)"
        default: ""

concurrency:
  group: lab-agent
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AntoinePinto/betting-lab
          token: ${{ secrets.LAB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rôle et arrêt
        id: ctx
        env:
          INPUT_ROLE: ${{ inputs.role }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "41 3,15 * * *") ROLE=skeptic ;;
            "23 21 * * *") ROLE=librarian ;;
            "53 8 * * *") ROLE=engineer ;;
            *) ROLE="${INPUT_ROLE:-explorer}" ;;
          esac
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          if [ -f STOP ]; then echo "stop=1" >> "$GITHUB_OUTPUT"; echo "STOP présent : session ignorée"; fi

      - uses: actions/setup-python@v5
        if: steps.ctx.outputs.stop != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        if: steps.ctx.outputs.stop != '1'
        run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        if: steps.ctx.outputs.stop != '1'
        with:
          credentials_json: ${{ secrets.GCP_EXPLORER_SA_KEY }}

      - name: Session de l'agent
        if: steps.ctx.outputs.stop != '1'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: "false"   # dépôt public : jamais de transcription dans les logs
          display_report: "false"
          prompt: |
            Tu es l'agent « ${{ steps.ctx.outputs.role }} » de betting-lab. Le dépôt est déjà cloné dans le
            dossier courant. Lis CLAUDE.md (il importe AGENTS.md et CHARTER.md), puis suis le déroulé
            d'AGENTS.md. Ton rôle est décrit dans .claude/agents/${{ steps.ctx.outputs.role }}.md.
            ${{ inputs.focus }}
            Contraintes d'exécution : une seule unité de travail ; commits locaux en français ; AUCUN
            git push (le workflow pousse après contrôle) ; termine par une note de passation dans journal/.
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Agent,Bash(python *),Bash(python3 *),Bash(pip install *),Bash(pytest *),Bash(git add *),Bash(git commit *),Bash(git status*),Bash(git log *),Bash(git diff *),Bash(git show *),Bash(git rm *),Bash(cp *),Bash(ls *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(mkdir *),Bash(sort *),Bash(jq *),Bash(date *)"

      - name: Transcription vers le bucket privé
        if: steps.ctx.outputs.stop != '1' && always()
        continue-on-error: true
        env:
          ROLE: ${{ steps.ctx.outputs.role }}
        run: |
          f="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$f" ]; then
            gcloud storage cp "$f" "gs://betting-lab-logs-502015/transcriptions/$(date -u +%F)/${GITHUB_RUN_ID}-${ROLE}.json"
          else
            echo "pas de transcription à envoyer"
          fi

      - name: Contrôle et push
        id: push
        if: steps.ctx.outputs.stop != '1' && always()
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN }}
          ROLE: ${{ steps.ctx.outputs.role }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/AntoinePinto/betting-lab.git"
          set +e
          bash scripts/push.sh "agent ${ROLE} : session du $(date -u +%F\ %H:%M)" --guard
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "3" ] && exit 0
          exit "$code"

      - name: Travail écarté par le garde-fou
        if: steps.push.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN }}
        run: |
          gh issue create -R AntoinePinto/betting-lab --title "Garde-fou : session de l'agent écartée ($(date -u +%F))" \
            --body "Le travail de la session a été écarté (chemin protégé, fichier trop gros ou secret détecté). Run ${GITHUB_RUN_ID} du dépôt runner ; le patch est dans le bucket privé (rejected/)." || true
      - name: Patch rejeté vers le bucket privé
        if: steps.push.outputs.code == '3'
        continue-on-error: true
        run: gcloud storage cp /tmp/rejected.patch "gs://betting-lab-logs-502015/rejected/$(date -u +%F)/${GITHUB_RUN_ID}.patch"
