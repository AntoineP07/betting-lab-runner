name: bucket-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_EXPLORER_SA_KEY }}
      - run: |
          echo '{"test":"bucket"}' > /tmp/t.json
          name="transcriptions/test/${GITHUB_RUN_ID}.json"
          curl -sf -X POST --data-binary @/tmp/t.json -H "Content-Type: application/json"             -H "Authorization: Bearer $(gcloud auth print-access-token)"             "https://storage.googleapis.com/upload/storage/v1/b/betting-lab-logs-502015/o?uploadType=media&name=${name//\//%2F}" > /dev/null             && echo "envoi ok"
